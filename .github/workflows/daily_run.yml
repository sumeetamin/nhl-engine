name: Daily NHL Pipeline + Result Tracker

on:
  schedule:
    - cron: '0 10 * * *'   # Run 1 — 10:00 UTC (6:00am EST) — morning update
    - cron: '0 16 * * *'   # Run 2 — 16:00 UTC (12:00pm EST) — afternoon odds/goalies
    - cron: '0 22 * * *'   # Run 3 — 22:00 UTC (6:00pm EST) — evening confirmed lineups
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which step to run'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - grade_only
          - predict_only

jobs:

  grade-results:
    name: Grade Yesterday + Update Snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'predict_only') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 10 * * *')

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Result Tracker
        run: python track_results.py
        env:
          PYTHONUNBUFFERED: "1"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Commit updated ledger + snapshot
        run: |
          git config --global user.name  "sumeetamin"
          git config --global user.email "aminsumeet@gmail.com"
          git add model_records_ledger.json || true
          git add frontend/public/historical_stats.json || true
          git diff --staged --quiet || git commit -m "📊 Auto: Grade results $(date +'%Y-%m-%d')"
          git push

  generate-predictions:
    name: Generate Predictions + Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: grade-results
    if: |
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.mode != 'grade_only') ||
        (github.event_name == 'schedule')
      )

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore GIFT cache
        uses: actions/cache@v4
        with:
          path: gift_cache.json
          key: gift-cache-${{ hashFiles('gift_cache.json') }}
          restore-keys: gift-cache-

      - name: Run NHL Pipeline
        run: python run_pipeline.py
        env:
          PYTHONUNBUFFERED: "1"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Commit and push all updates
        run: |
          git config --global user.name  "sumeetamin"
          git config --global user.email "aminsumeet@gmail.com"
          git add -A
          git diff --staged --quiet || git commit -m "🤖 Auto: Predictions $(date +'%Y-%m-%d %H:%M UTC')"
          git push

  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [grade-results, generate-predictions]
    if: failure()
    steps:
      - name: Log failure
        run: |
          echo "❌ Pipeline failed at $(date)"
          echo "🔗 Check: https://github.com/${{ github.repository }}/actions"