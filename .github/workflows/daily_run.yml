name: Daily NHL Pipeline + Result Tracker

on:
  schedule:
    - cron: '0 5 * * *'    # Overnight refresh — midnight EST / 1:00am EDT
    - cron: '0 10 * * *'   # Run 1 — 10:00 UTC (6:00am EDT) — grade overnight results
    - cron: '0 16 * * *'   # Run 2 — 16:00 UTC (12:00pm EDT) — afternoon odds/goalies
    - cron: '0 22 * * *'   # Run 3 — 22:00 UTC (6:00pm EDT) — evening confirmed lineups
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which step to run'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - grade_only
          - predict_only

jobs:

  # ── Job 1: Grade yesterday's results, update CSV + result panels ─────────────
  grade-results:
    name: Grade Yesterday + Update Snapshot
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'predict_only') ||
      (github.event_name == 'schedule' && github.event.schedule == '0 10 * * *')

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Result Tracker
        run: python track_results.py
        env:
          PYTHONUNBUFFERED: "1"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Commit all updated files
        run: |
          git config --global user.name  "sumeetamin"
          git config --global user.email "aminsumeet@gmail.com"
          # past_games.csv — model now has real scores for better projections
          git add frontend/public/past_games.csv          || true
          # grade_log.json — full pick history
          git add frontend/public/grade_log.json          || true
          # historical_stats.json — real W/L stats for Snapshot tab
          git add frontend/public/historical_stats.json   || true
          # results_index.json — powers HIT/MISS result panels on frontend
          git add frontend/public/results_index.json      || true
          git diff --staged --quiet || git commit -m "📊 Auto: Grade results $(date +'%Y-%m-%d')"
          git push

  # ── Job 2: Run ML pipeline with fresh data, deploy predictions ───────────────
  generate-predictions:
    name: Generate Predictions + Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: grade-results
    if: |
      always() &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.mode != 'grade_only') ||
        (github.event_name == 'schedule')
      )

    steps:
      - name: Checkout repo (gets latest including grade-results commit)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest — ensures we have updated past_games.csv from job 1
        run: git pull origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore GIFT cache
        uses: actions/cache@v4
        with:
          path: gift_cache.json
          key: gift-cache-${{ hashFiles('gift_cache.json') }}
          restore-keys: gift-cache-

      - name: Run NHL Pipeline
        run: python run_pipeline.py
        env:
          PYTHONUNBUFFERED: "1"
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}

      - name: Commit and push all prediction files
        run: |
          git config --global user.name  "sumeetamin"
          git config --global user.email "aminsumeet@gmail.com"
          # Only commit prediction files — never historical_stats.json (owned by grade-results job)
          git add frontend/public/daily_predictions.json || true
          git add frontend/public/gift_stats.json        || true
          git add frontend/public/gift_cache.json        || true
          git add gift_cache.json                        || true
          git diff --staged --quiet || git commit -m "🤖 Auto: Predictions $(date +'%Y-%m-%d %H:%M UTC')"
          git push

  # ── Failure notification ──────────────────────────────────────────────────────
  notify-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [grade-results, generate-predictions]
    if: failure()
    steps:
      - name: Log failure
        run: |
          echo "❌ Pipeline failed at $(date)"
          echo "🔗 Check: https://github.com/${{ github.repository }}/actions"
