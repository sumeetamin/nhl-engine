name: NHL V5 Engine Automation

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:

jobs:
  run-math-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        working-directory: ./frontend
        run: pip install -r requirements.txt

      - name: Grade Yesterday's Predictions
        working-directory: ./frontend
        run: python track_results.py

      - name: Run Sumeet's V5 Engine (Generate Today)
        working-directory: ./frontend
        run: python run_pipeline.py

      - name: Commit and Push New Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated V5 Engine Data Update & Ledger Grading"
          file_pattern: 'frontend/public/*.json'