name: NHL V5 Engine Automation

on:
  schedule:
    # This runs at 14:00 UTC every day (which is 10:00 AM EST)
    - cron: '0 14 * * *'
  workflow_dispatch: # This adds a button to GitHub so you can click "Run Now" anytime

jobs:
  run-math-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Sumeet's V5 Engine
        run: python run_pipeline.py

      - name: Commit and Push New Data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated V5 Engine Data Update"
          file_pattern: 'public/*.json'